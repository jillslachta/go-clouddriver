openapi: "3.0.0"
info:
  description: "This is the go-clouddriver server API."
  version: "0.1.0"
  title: "go-clouddriver"
  termsOfService: "http://swagger.io/terms/"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers: 
  - url: "http://spin-clouddriver.spinnaker:7002"
tags:
- name: "core"
  description: "Core endpoints to the microservice"
- name: "kubernetes"
  description: "Endpoints that handle kubernetes operations"
- name: "credentials"
  description: "Credentials API controller"
- name: "applications"
  description: "Applications API controller"
- name: "manifests"
  description: "Manifests API controller"
- name: "artifacts"
  description: "Artifacts API controller"
- name: "tasks"
  description: "Tasks API controller"
- name: "instances"
  description: "Instances API controller"
- name: "search"
  description: "Search API controller"
- name: "securityGroups"
  description: "Security groups API controller (not implemented)"
- name: "features"
  description: "Features API controller"
- name: "projects"
  description: "Projects API controller"
paths:
  /health:
    get:
      tags:
      - "core"
      summary: "Health check endpoint"
      responses:
        "200":
          description: "OK"
  /cache/kubernetes/manifest:
    post:
      tags:
      - "kubernetes"
      summary: "Force cache refresh"
      responses:
        "200":
          description: "OK"
  /credentials:
    get:
      tags:
      - "credentials"
      summary: "List account credentials"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /credentials/{account}:
    get:
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "credentials"
      summary: "Get account credentials"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications:
    get:
      tags:
      - "applications"
      summary: "List Spinnaker applications and associated cluster names"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/serverGroupManagers:
    get:
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "applications"
      summary: "List server group managers for a given Spinnaker application"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/serverGroups:
    get:
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "applications"
      summary: "List server groups for a given Spinnaker application"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/serverGroups/{account}/{location}/{name}:
    get:
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "applications"
      summary: "Get a server group for a given application, account, location, and name"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/loadBalancers:
    get:
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "applications"
      summary: "List load balancers for a given Spinnaker application"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/clusters:
    get:
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      tags:
      - "applications"
      summary: "List clusters for a given Spinnaker application"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /applications/{application}/clusters/{account}/{clusterName}/kubernetes:
    get:
      tags:
      - "applications"
      summary: "Get a cluster and its server groups by name"
      description: "Returns the cluster named clusterName for the given application and account, including its server groups. clusterName must be in the format 'kind name' (e.g. 'deployment my-deployment', URL-encoded as 'deployment%20my-deployment'); a 'deployment' kind lists ReplicaSets. Resources are listed with the default Spinnaker label selector (restricted to the account's namespaces for namespace-scoped accounts) and filtered on the moniker.spinnaker.io/cluster and moniker.spinnaker.io/application annotations. Protected by AuthApplication(READ): when both X-Spinnaker-User and X-Spinnaker-Application headers are sent, Fiat is checked for READ on the application named in the X-Spinnaker-Application header; otherwise the check is skipped."
      operationId: "listClustersByName"
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "clusterName"
        in: "path"
        required: true
        description: "Cluster name in the format 'kind name', e.g. 'deployment my-deployment'"
        schema:
          type: "string"
      - name: "X-Spinnaker-User"
        in: "header"
        required: false
        description: "Spinnaker user; used with X-Spinnaker-Application for the Fiat READ check"
        schema:
          type: "string"
      - name: "X-Spinnaker-Application"
        in: "header"
        required: false
        description: "Application checked against Fiat for READ permission"
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  accountName:
                    type: "string"
                  application:
                    type: "string"
                  loadBalancers:
                    type: "array"
                    description: "Always empty"
                    items:
                      type: "string"
                  moniker:
                    type: "object"
                    properties:
                      app:
                        type: "string"
                      cluster:
                        type: "string"
                  name:
                    type: "string"
                    description: "The cluster name ('kind name')"
                  serverGroups:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        account:
                          type: "string"
                        apiVersion:
                          type: "string"
                        cloudProvider:
                          type: "string"
                          description: "Always 'kubernetes'"
                        displayName:
                          type: "string"
                        kind:
                          type: "string"
                        labels:
                          type: "object"
                          additionalProperties:
                            type: "string"
                        moniker:
                          type: "object"
                          properties:
                            app:
                              type: "string"
                            cluster:
                              type: "string"
                            sequence:
                              type: "integer"
                        name:
                          type: "string"
                          description: "'kind name', e.g. 'replicaSet my-deployment-abc123'"
                        namespace:
                          type: "string"
                        region:
                          type: "string"
                          description: "The namespace"
                        serverGroupManagers:
                          type: "array"
                          description: "Built from the resource's owner references"
                          items:
                            type: "object"
                            properties:
                              account:
                                type: "string"
                              location:
                                type: "string"
                              name:
                                type: "string"
                        type:
                          type: "string"
                          description: "Always 'kubernetes'"
                        zones:
                          type: "array"
                          description: "Always empty"
                          items: {}
                  type:
                    type: "string"
                    description: "Always 'kubernetes'"
        "400":
          description: "Bad Request - clusterName is not in 'kind name' format, or the account's Kubernetes provider could not be loaded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Fiat authorization call failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - user lacks READ on the application"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - listing the Kubernetes resources failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{application}/jobs/{account}/{location}/{name}:
    get:
      tags:
      - "applications"
      summary: "Get a Kubernetes job"
      description: "Returns the job identified by name ('kind name', e.g. 'job my-job') in namespace location of the given account. The application path parameter is not used by the handler. Protected by AuthApplication(READ) (Fiat check on the X-Spinnaker-Application header's application when X-Spinnaker-User and X-Spinnaker-Application are both sent) and AuthAccount(READ) (Fiat check on the account path parameter when X-Spinnaker-User is sent). completionDetails fields and pods are currently always empty."
      operationId: "getJob"
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        description: "Kubernetes namespace"
        schema:
          type: "string"
      - name: "name"
        in: "path"
        required: true
        description: "Job name in the format 'kind name', e.g. 'job my-job'"
        schema:
          type: "string"
      - name: "X-Spinnaker-User"
        in: "header"
        required: false
        description: "Spinnaker user; enables the Fiat READ checks"
        schema:
          type: "string"
      - name: "X-Spinnaker-Application"
        in: "header"
        required: false
        description: "Application checked against Fiat for READ permission"
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  account:
                    type: "string"
                  completionDetails:
                    type: "object"
                    properties:
                      exitCode:
                        type: "string"
                      message:
                        type: "string"
                      reason:
                        type: "string"
                      signal:
                        type: "string"
                  createdTime:
                    type: "integer"
                    format: "int64"
                    description: "Creation timestamp in epoch milliseconds"
                  jobState:
                    type: "string"
                    enum:
                    - "Running"
                    - "Succeeded"
                    - "Failed"
                  location:
                    type: "string"
                  name:
                    type: "string"
                  pods:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: true
                  provider:
                    type: "string"
                    description: "Always 'kubernetes'"
        "400":
          description: "Bad Request - name is not in 'kind name' format, or the account's Kubernetes provider could not be loaded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Fiat authorization call failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - user lacks READ on the application or account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - getting the job from Kubernetes failed (including not found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - "applications"
      summary: "Delete (cancel) a Kubernetes job - not implemented"
      description: "Not implemented for the Kubernetes provider V2 (see https://github.com/spinnaker/spinnaker/issues/4644#issuecomment-627287782). Always responds 500 with the message 'cancelJob is not implemented for the Kubernetes provider'. No auth middleware is applied."
      operationId: "deleteJob"
      parameters:
      - name: "application"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "500":
          description: "Internal Server Error - always returned: cancelJob is not implemented for the Kubernetes provider"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /kubernetes/ops:
    post:
      tags:
      - "kubernetes"
      summary: "Create a kubernetes operation"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /manifests/{account}/{location}/{kind}:
    get:
      tags:
      - "manifests"
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "kind"
        in: "path"
        required: true
        description: "Kind and name separated by a space (URL-encoded), e.g. \"deployment my-deployment\". Named \"kind\" to match the route parameter in internal/api/server.go."
        schema:
          type: "string"
      summary: "Get a manifest for a given account, location, and name"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /manifests/{account}/{location}/{kind}/cluster/{application}/{cluster}:
    get:
      tags:
      - "manifests"
      summary: "List manifest coordinates for a Spinnaker cluster"
      description: "Lists the Kubernetes resources of the given kind in the given account and namespace that belong to a Spinnaker application and cluster. Resources are listed with the label selector `app.kubernetes.io/managed-by in (spinnaker, spinnaker-operator)`, then kept only if their `moniker.spinnaker.io/cluster` and `moniker.spinnaker.io/application` annotations match the `cluster` and `application` path params. Results are sorted by name ascending. If listing the resources from Kubernetes fails, the error is logged and an empty array is returned with 200 (matching OSS Clouddriver). No auth middleware is applied to this route."
      operationId: "listManifestsByCluster"
      parameters:
      - name: "account"
        in: "path"
        required: true
        description: "Name of the Kubernetes provider (account)"
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        description: "Kubernetes namespace"
        schema:
          type: "string"
      - name: "kind"
        in: "path"
        required: true
        description: "Kubernetes kind only (e.g. `replicaSet`, `deployment`), not a \"kind name\" pair. A fully qualified kind such as `MutatingWebhookConfiguration.admissionregistration.k8s.io` is accepted; everything after the first `.` is ignored."
        schema:
          type: "string"
      - name: "application"
        in: "path"
        required: true
        description: "Spinnaker application, matched against the `moniker.spinnaker.io/application` annotation"
        schema:
          type: "string"
      - name: "cluster"
        in: "path"
        required: true
        description: "Spinnaker cluster (e.g. `replicaSet my-app`), matched against the `moniker.spinnaker.io/cluster` annotation"
        schema:
          type: "string"
      responses:
        "200":
          description: "OK. Matching manifest coordinates sorted by name; an empty array if none match or if the Kubernetes list call fails."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    kind:
                      type: "string"
                      description: "Kind of the resource with its first letter lowercased (e.g. `replicaSet`)"
                    name:
                      type: "string"
                      description: "Name of the resource"
                    namespace:
                      type: "string"
                      description: "Namespace of the resource"
        "400":
          description: "Bad Request. The Kubernetes provider for the account could not be loaded (e.g. account not found, bad CA data, Arcade token error, client creation error)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error. The kind could not be resolved to a GroupVersionResource."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /manifests/{account}/{location}/{kind}/cluster/{application}/{cluster}/dynamic/{criteria}:
    get:
      tags:
      - "manifests"
      summary: "Get the coordinates of one manifest in a Spinnaker cluster chosen by criteria"
      description: "Lists the Kubernetes resources of the given kind in the given account and namespace (label selector `app.kubernetes.io/managed-by in (spinnaker, spinnaker-operator)`) whose `moniker.spinnaker.io/cluster` and `moniker.spinnaker.io/application` annotations match the path params, then picks one by `criteria`: `oldest`/`newest`/`second_newest` sort by creation timestamp, `smallest`/`largest` sort by `.spec.replicas`. Used by Spinnaker to resolve dynamic manifest targets. No auth middleware is applied to this route."
      operationId: "getManifestByCriteria"
      parameters:
      - name: "account"
        in: "path"
        required: true
        description: "Name of the Kubernetes provider (account)"
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        description: "Kubernetes namespace"
        schema:
          type: "string"
      - name: "kind"
        in: "path"
        required: true
        description: "Kubernetes kind only (e.g. `replicaSet`, `deployment`), not a \"kind name\" pair. A fully qualified kind such as `MutatingWebhookConfiguration.admissionregistration.k8s.io` is accepted; everything after the first `.` is ignored."
        schema:
          type: "string"
      - name: "application"
        in: "path"
        required: true
        description: "Spinnaker application, matched against the `moniker.spinnaker.io/application` annotation"
        schema:
          type: "string"
      - name: "cluster"
        in: "path"
        required: true
        description: "Spinnaker cluster (e.g. `replicaSet my-app`), matched against the `moniker.spinnaker.io/cluster` annotation"
        schema:
          type: "string"
      - name: "criteria"
        in: "path"
        required: true
        description: "How to pick the resource: `oldest` or `newest` (by creation timestamp), `second_newest` (needs at least two resources), `smallest` or `largest` (by `.spec.replicas`). Any other value returns 400."
        schema:
          type: "string"
          enum:
          - "newest"
          - "second_newest"
          - "oldest"
          - "largest"
          - "smallest"
      responses:
        "200":
          description: "OK. Coordinates of the selected resource."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  kind:
                    type: "string"
                    description: "The `kind` path param as given (with any `.group` suffix removed; casing not changed)"
                  name:
                    type: "string"
                    description: "Name of the selected resource"
                  namespace:
                    type: "string"
                    description: "Namespace of the selected resource"
        "400":
          description: "Bad Request. The Kubernetes provider for the account could not be loaded, `criteria` is unknown, or `criteria` is `second_newest` but only one matching resource exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found. No resources matched the application and cluster."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error. The kind could not be resolved to a GroupVersionResource, or listing the resources from Kubernetes failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /instances/{account}/{location}/{name}:
    get:
      tags:
      - "instances"
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Get an instance for a given account, location, and name"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /instances/{account}/{location}/{name}/console:
    get:
      tags:
      - "instances"
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "location"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "provider"
        in: "query"
        required: true
        schema:
          type: "string"
      summary: "Get instance console logs for a given account, location, and name"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
        "501":
          description: "Not implemented"
  /task/{id}:
    get:
      tags:
      - "tasks"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Get a task result"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Bad Request"
        "500":
          description: "Internal Server Error"
  /search:
    get:
      tags:
      - "search"
      summary: "Search for Kubernetes resources by kind and namespace"
      description: "Generic search endpoint. Lists resources of the given Kubernetes kind (`type`) in the given namespace (`q`) concurrently across every account named in the X-Spinnaker-Accounts header; providers not listed in the header are skipped, so a missing header returns no results. Accounts that are not allowed to list the kind or access the namespace, or whose list call fails, are silently skipped. Requests for the unsupported types applications, instances, loadBalancers, projects and securityGroups (case-insensitive) return a single empty page with platform \"aws\". The response is always one page (pageNumber 1); `pageSize` is echoed back but not used to paginate. Responses carry `Cache-Control: public, max-age=30` and `Vary: X-Spinnaker-Accounts`."
      operationId: "search"
      parameters:
      - name: "q"
        in: "query"
        required: true
        description: "Namespace to search in. Also echoed back as the page `query`."
        schema:
          type: "string"
      - name: "type"
        in: "query"
        required: true
        description: "Kubernetes kind to search for (e.g. \"deployment\", \"configMap\")."
        schema:
          type: "string"
      - name: "pageSize"
        in: "query"
        required: false
        description: "Echoed back in the response page; ignored for pagination. Non-integer or missing values become 0."
        schema:
          type: "integer"
      - name: "X-Spinnaker-Accounts"
        in: "header"
        required: false
        description: "Comma-separated list of account names the user can access; only these accounts are searched."
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    pageNumber:
                      type: "integer"
                      description: "Always 1"
                    pageSize:
                      type: "integer"
                      description: "Value of the pageSize query parameter"
                    query:
                      type: "string"
                      description: "Value of the q query parameter (the namespace)"
                    totalMatches:
                      type: "integer"
                      description: "Number of results"
                    platform:
                      type: "string"
                      description: "Only set (to \"aws\") for unsupported types"
                    results:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          account:
                            type: "string"
                          group:
                            type: "string"
                            description: "The requested kind"
                          kubernetesKind:
                            type: "string"
                            description: "The requested kind"
                          name:
                            type: "string"
                            description: "\"<kind> <resource name>\""
                          namespace:
                            type: "string"
                          provider:
                            type: "string"
                            description: "Always \"kubernetes\""
                          region:
                            type: "string"
                            description: "Same as namespace"
                          type:
                            type: "string"
                            description: "Spinnaker kind for the requested Kubernetes kind (e.g. serverGroupManagers), or \"unclassified\""
                          application:
                            type: "string"
                          cluster:
                            type: "string"
        "400":
          description: "Bad Request - the q or type query parameter is missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - listing providers failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /securityGroups:
    get:
      tags:
      - "securityGroups"
      summary: "List security groups (not implemented)"
      description: "Not implemented. Always returns an empty JSON object `{}`, which is enough to satisfy Deck. No authentication middleware is applied."
      operationId: "listSecurityGroups"
      responses:
        "200":
          description: "OK - always an empty object"
          content:
            application/json:
              schema:
                type: "object"
  /artifacts/credentials:
    get:
      tags:
      - "artifacts"
      summary: "List artifacts credentials"
      responses:
        "200":
          description: "OK"
  /artifacts/account/{account}/names:
    get:
      tags:
      - "artifacts"
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "List artifact names for a given (helm) account"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /artifacts/account/{account}/versions:
    get:
      tags:
      - "artifacts"
      parameters:
      - name: "account"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "List artifact versions for a given (helm) account"
      responses:
        "200":
          description: "OK"
        "500":
          description: "Internal Server Error"
  /artifacts/fetch/:
    put:
      tags:
      - "artifacts"
      summary: "Retrieve a given artifact"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Bad Request"
        "500":
          description: "Internal Server Error"
  /features/stages:
    get:
      tags:
      - "features"
      summary: "List stage features"
      description: "Returns a fixed list of 23 Spinnaker stage names (resizeServerGroup, runJob, deployManifest, ...). Every entry is returned with `enabled: false`. No authentication middleware is applied."
      operationId: "listStages"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    enabled:
                      type: "boolean"
                      description: "Always false"
                    name:
                      type: "string"
                      description: "Stage name, e.g. \"deployManifest\""
  /projects/{project}/clusters:
    get:
      tags:
      - "projects"
      summary: "List cluster details for a Spinnaker project"
      description: "Fetches the project configuration from Front50 (GET /v2/projects/{project}), then for each configured cluster whose account exists in the database lists ReplicaSets, DaemonSets and StatefulSets of the project's applications and summarizes them by account, application and namespace (matching moniker stack/detail annotations). Returns an empty array if the project has no clusters. Responses carry Cache-Control: public, max-age=30. No auth middleware and no request headers are read."
      operationId: "listProjectClusters"
      parameters:
      - name: "project"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    account:
                      type: "string"
                    applications:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          application:
                            type: "string"
                          clusters:
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                builds:
                                  type: "array"
                                  description: "A single default build '0' collecting all images"
                                  items:
                                    type: "object"
                                    properties:
                                      buildNumber:
                                        type: "string"
                                      deployed:
                                        type: "integer"
                                        format: "int64"
                                        description: "Epoch milliseconds"
                                      images:
                                        type: "array"
                                        items:
                                          type: "string"
                                instanceCounts:
                                  type: "object"
                                  description: "Only total and up are populated"
                                  properties:
                                    down:
                                      type: "integer"
                                    outOfService:
                                      type: "integer"
                                    starting:
                                      type: "integer"
                                    total:
                                      type: "integer"
                                    unknown:
                                      type: "integer"
                                    up:
                                      type: "integer"
                                lastPush:
                                  type: "integer"
                                  format: "int64"
                                  description: "Epoch milliseconds"
                                region:
                                  type: "string"
                                  description: "The namespace"
                          lastPush:
                            type: "integer"
                            format: "int64"
                            description: "Epoch milliseconds"
                    detail:
                      type: "string"
                    instanceCounts:
                      type: "object"
                      properties:
                        down:
                          type: "integer"
                        outOfService:
                          type: "integer"
                        starting:
                          type: "integer"
                        total:
                          type: "integer"
                        unknown:
                          type: "integer"
                        up:
                          type: "integer"
                    stack:
                      type: "string"
        "400":
          description: "Bad Request - the project could not be fetched from Front50 (e.g. not found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - listing providers from the database or Kubernetes resources failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/kubernetes/providers:
    get:
      tags:
      - "kubernetes"
      summary: "Retrieves list of all Kubernetes accounts (providers)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/KubernetesProvider"
        "500":
          description: "Internal Server Error"
    post:
      tags:
      - "kubernetes"
      summary: "Create a new Kubernetes account (provider)"
      requestBody:
        description: "Object that describes the kubernetes provider"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesProvider"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KubernetesProvider"
        "400":
          description: "Bad Request"
        "409":
          description: "Conflict"
        "500":
          description: "Internal Server Error"
    put:
      tags:
      - "kubernetes"
      summary: "Create, or replace, a Kubernetes account (provider)"
      requestBody:
        description: "Object that describes the kubernetes provider"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesProvider"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KubernetesProvider"
        "400":
          description: "Bad Request"
        "500":
          description: "Internal Server Error"
  /v1/kubernetes/providers/{name}:
    get:
      tags:
      - "kubernetes"
      parameters:
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Retrieve a Kubernetes account (provider)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KubernetesProvider"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
    delete:
      tags:
      - "kubernetes"
      parameters:
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Delete a Kubernetes account (provider)"
      responses:
        "204":
          description: "No Content"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
  /v1/kubernetes/providers/{name}/resources:
    put:
      tags:
      - "kubernetes"
      parameters:
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Updates resources, read from the cluster, for the Kubernetes account (provider)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/KubernetesResource"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
    delete:
      tags:
      - "kubernetes"
      parameters:
      - name: "name"
        in: "path"
        required: true
        schema:
          type: "string"
      summary: "Deletes the database entries for all resources for the Kubernetes account (provider)"
      responses:
        "204":
          description: "No Content"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
components:
  schemas:
    KubernetesProvider:
      type: "object"
      required:
      - name
      - host
      properties:
        name:
          type: "string"
          description: "The unique name identifiying this Spinnaker account"
          example: "gke_np-platforms-cd-thd_us-east1_np-us-east1-np"
        host:
          type: "string"
          description: "The endpoint (hostname or ip address) for reaching the kubernetes cluster's control plane"
          example: "https://34.73.20.115"
        caData:
          type: "string"
          description: "The base64-encoded CA certificate of the kubernetes cluster"
          example: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0t..."
        tokenProvider:
          type: "string"
          description: "The provider of the kubernetes auth token, defaults to google"
          example: "google"
        namespaces:
          type: "array"
          items:
            type: "string"
          description: "The kubernetes namespaces that this account is limited to accessing.  If not specified, defaults to all namespaces"
          example: ["example-namespace"]
        namespace:
          type: "string"
          deprecated: true
          description: "The kubernetes namespace that this account is limited to accessing.  If not specified, defaults to all namespaces"
          example: "example-namespace"
        permissions:
          $ref: "#/components/schemas/Permissions"
    KubernetesResource:
      type: "object"
      required:
      - accountName
      - id
      properties:
        accountName:
          type: "string"
          description: "The Spinnaker account that deployed this resource"
          example: "gke_gcp-project-id_us-east1_cluster-name"
        id:
          type: "string"
          description: "The unique ID for identifying this row in the database"
          example: "f0500ae7-5db3-4c09-be11-c6c4d8016402"
        timestamp:
          type: "string"
          description: "The time this resource row was added to the database"
          example: "2021-10-16T19:48:47.923Z"
        taskId:
          type: "string"
          description: "An identifier of the task responsible for creating this resource row in the database"
          example: "f0500ae7-5db3-4c09-be11-c6c4d8016402"
        apiGroup:
          type: "string"
          description: "The kubernetes API group for this resource"
          example: "apps"
        name:
          type: "string"
          description: "The name of this resource"
          example: "example-name"
        namespace:
          type: "string"
          description: "The kubernetes namespace of this resource"
          example: "example-namespace"
        resource:
          type: "string"
          description: "The Kubernetes API resource name for this resource"
          example: "deployments"
        version:
          type: "string"
          description: "The kubernetes API version for this resource"
          example: "v1"
        kind:
          type: "string"
          description: "The kubernetes kind of this resource"
          example: "Deployment"
        spinnakerApp:
          type: "string"
          description: "The name of the Spinnaker application which deployed this resource"
          example: "example-application"
    ErrorResponse:
      type: "object"
      description: "Error body written by the error middleware for 4xx/5xx responses"
      properties:
        error:
          type: "string"
          description: "HTTP status text; for 5xx responses it also includes an error ID"
        message:
          type: "string"
          description: "Error message"
        status:
          type: "integer"
          description: "HTTP status code"
        timestamp:
          type: "integer"
          format: "int64"
          description: "Unix time in milliseconds"
    Permissions:
      type: "object"
      required:
      - read
      - write
      properties:
        read:
          type: "array"
          items:
            type: "string"
          description: "List of groups that have READ access"
          example: ["group1"]
        write:
          type: "array"
          items:
            type: "string"
          description: "List of groups that have WRITE access"
          example: ["group1", "group2"]
